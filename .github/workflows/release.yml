# macOS validation only. Releases are created manually after review.
# Main builds use the 1.6.8 artifact label; PR builds use dev.
# Both keep the app bundle version numeric (1.6.8).
name: macOS build and test

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  VERSION: '1.6.8'
  APP_DISPLAY_NAME: Snapline 自动文字版
  SIGN_IDENTITY: '-'

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Test with Xcode XCTest
        working-directory: macos
        run: |
          swift --version
          swift test

      - name: Build the universal app
        working-directory: macos
        run: bash scripts/make-dmg.sh

      - name: Prepare artifacts
        working-directory: macos
        env:
          BUILD_EVENT: ${{ github.event_name }}
        run: |
          label="$VERSION"
          if [[ "$BUILD_EVENT" == "pull_request" ]]; then label="dev"; fi
          mkdir -p ../out-mac
          cp "build/Snapline-${VERSION}.dmg" "../out-mac/Snapline-AutoText-${label}.dmg"
          cp "build/Snapline-${VERSION}-mac.zip" "../out-mac/Snapline-AutoText-${label}-mac.zip"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ github.event_name == 'pull_request' && 'Snapline-AutoText-dev' || 'Snapline-AutoText-1.6.8' }}
          path: out-mac/*
          if-no-files-found: error
